services:
  lavalink:
    # pin the image version to Lavalink v4 and use the alpine variant for a smaller image size
    image: ghcr.io/lavalink-devs/lavalink:latest
    container_name: lavalink
    restart: unless-stopped
    environment:
      - _JAVA_OPTIONS=-Xmx6G
      - SERVER_PORT=2333
      - LAVALINK_SERVER_PASSWORD=youshallnotpass
      - YT_OAUTH_TOKEN=${YT_OAUTH_TOKEN}
      - POTTER_ENDPOINT=http://webpo:8080
    volumes:
      - ./application.yaml:/opt/Lavalink/application.yaml
      - ./plugins:/opt/Lavalink/plugins
    networks:
      - lavalink
    depends_on:
      - webpo
    expose:
      # lavalink exposes port 2333 to connect to for other containers (this is for documentation purposes only)
      - 2333
    ports:
      # you only need this if you want to make your lavalink accessible from outside of containers, keep in mind this will expose your lavalink to the internet
      # - "2333:2333"
      # if you want to restrict access to localhost only
      - "127.0.0.1:2333:2333"
  bot:
    image: andrewromanyk/el_nino:0.0.1
    container_name: el_nino
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - LAVALINK_ENDPOINT=lavalink:2333
      - LAVALINK_PASSWORD=${LAVALINK_PASSWORD}
      - BOT_ID=${BOT_ID}
      - CLIENT_NAME=${CLIENT_NAME}
    depends_on:
      - lavalink
    networks:
      - lavalink
    volumes:
      - bot-data:/release/storage
  webpo:
    container_name: webpo
    image: ghcr.io/ashton318/webpo-generator:latest
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - lavalink
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      - NODE_ENV=production
      - HOST=${HOST:-::}
      - PORT=${PORT:-8080}
      - WORKERS=${WORKERS:-1}
      - QUEUE_SIZE=${QUEUE_SIZE:-32}
      - MAX_PENDING_REQUESTS=${MAX_PENDING_REQUESTS:-256}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-30000}
      - CACHE_SIZE=${CACHE_SIZE:-100}
      - CACHE_TTL=${CACHE_TTL:-300000}
      - VISITOR_TTL=${VISITOR_TTL:-36000000}
      - API_TOKEN=${API_TOKEN:-}
    restart: unless-stopped
networks:
  # create a lavalink network you can add other containers to, to give them access to Lavalink
  lavalink:
    name: lavalink
volumes:
  bot-data: